name: Build Jurnal Harian APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada file ZIP project di root repository."
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          rm -rf android-project
          mkdir android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Isi project:"
          ls -la android-project

          if [ ! -f android-project/build.gradle ] || [ ! -f android-project/settings.gradle ]; then
            echo "ERROR: build.gradle/settings.gradle tidak ditemukan setelah extract."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JurnalHarian-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
